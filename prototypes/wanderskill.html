<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanderskill — idle skilling sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6d9bd; --panel:#f6eedb; --panel2:#ebdfc4; --border:#cdb88f; --text:#2a2016; --muted:#6f6052;
  --accent:#a86f12; --gold:#b98a14; --green:#4a8a36; --blue:#2f6fb0; --red:#b3362d; --bar:#ddcfb0;
  --frame:#1c2a1a; --rowhi:rgba(74,138,54,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1511; --panel:#241d18; --panel2:#2f261f; --border:#43362c; --text:#f1e8da; --muted:#a4958a;
    --accent:#e9b949; --gold:#f0c24f; --green:#7cc264; --blue:#73b3ea; --red:#e4675d; --bar:#3a2f27;
    --rowhi:rgba(124,194,100,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1511; --panel:#241d18; --panel2:#2f261f; --border:#43362c; --text:#f1e8da; --muted:#a4958a;
  --accent:#e9b949; --gold:#f0c24f; --green:#7cc264; --blue:#73b3ea; --red:#e4675d; --bar:#3a2f27;
  --rowhi:rgba(124,194,100,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.35;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
.pf{font-family:"Pixelify Sans",system-ui,sans-serif}
#app{height:100%;min-height:0;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"hud" "scene" "tabs" "panel";background:var(--bg)}
@media (min-width:900px){
  #app{max-width:1080px;grid-template-columns:544px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud tabs" "scene panel";column-gap:18px}
  .scene{align-self:start;border-radius:0 0 14px 14px;overflow:hidden}
}
.hud{grid-area:hud;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.logo{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:700;font-size:21px;color:var(--accent);letter-spacing:.3px;line-height:1}
.brand small{color:var(--muted);font-size:11px;white-space:nowrap}
.hud-stats{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;white-space:nowrap}
.pill b{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1}
.pill.gold b{color:var(--gold)}
.scene{grid-area:scene;background:var(--frame)}
.scene-wrap{display:flex;justify-content:center;background:var(--frame)}
.canvas-box{position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1}
.float{position:absolute;transform:translate(-50%,-100%);font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;white-space:nowrap;animation:floatUp 1.1s ease-out forwards}
.float.big{font-size:16px}
@keyframes floatUp{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-30px}}
.toasts{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{background:rgba(20,14,10,.88);color:#f7eedc;border:1px solid rgba(233,185,73,.45);padding:5px 10px;border-radius:8px;font-size:12px;line-height:1.3;max-width:92%;animation:toastIn .22s ease-out}
.toast.gold{border-color:#e9b949;color:#ffe7a3}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;background:rgba(20,14,10,.9);color:#f7eedc;border:1px solid rgba(233,185,73,.5);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.4;pointer-events:none}
.hint b{color:#ffe7a3}
.status{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:13px;min-height:34px}
.status span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{flex:0 0 84px;height:6px;background:var(--bar);border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:var(--green)}
.tabs{grid-area:tabs;display:flex;background:var(--panel);border-bottom:1px solid var(--border)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;touch-action:manipulation}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.panel{grid-area:panel;min-height:0;overflow-y:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
.panel textarea{-webkit-user-select:text;user-select:text}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.card-title{padding:9px 12px 7px;font-weight:600;border-bottom:1px solid var(--border)}
.card-title small{font-weight:400;color:var(--muted);margin-left:6px}
.skill-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.sicon{font-size:22px;width:30px;text-align:center;line-height:1}
.sinfo{flex:1;min-width:0}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl{font-family:"Pixelify Sans",system-ui,sans-serif;font-size:17px;color:var(--accent);line-height:1;white-space:nowrap}
.xpbar{height:7px;background:var(--bar);border-radius:4px;overflow:hidden;margin:5px 0 4px}
.xpbar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
.xptext{display:flex;flex-wrap:wrap;gap:0 10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{color:var(--muted);transition:transform .2s;font-size:12px}
.card.open .chev{transform:rotate(180deg)}
.actions{border-top:1px solid var(--border)}
.arow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:0}
.arow.locked{opacity:.5}
.arow.active{background:var(--rowhi)}
.dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
.ainfo{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;gap:1px}
.ainfo b{font-weight:600}
.ainfo small{color:var(--muted);font-size:11px;display:flex;flex-wrap:wrap;gap:0 8px}
.who{display:flex;gap:3px}
.avatar{width:10px;height:10px;border-radius:2px;background:var(--c,#999);display:inline-block;flex:none}
.lock{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn.primary{background:var(--accent);color:#1b1208;border-color:transparent;font-weight:600}
.btn.small{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font:inherit;font-size:12px;color:var(--text);white-space:nowrap;cursor:pointer;touch-action:manipulation;flex:none}
.chip.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip small{color:var(--muted)}
.chip.ghost{color:var(--muted);border-style:dashed}
.bank-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.bank-top b{font-family:"Pixelify Sans",system-ui,sans-serif;font-size:18px;color:var(--gold)}
.bank-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--border);font-size:13px}
.bank-opt small{color:var(--muted)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:360px){.items{grid-template-columns:1fr}}
.item{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--c,#999);border-radius:10px}
.item .ii{font-size:18px;line-height:1}
.item .it{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px}
.item .it b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .it small{color:var(--muted);font-size:11px}
.item .tag{font-size:10px;color:var(--green)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.shop-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border)}
.shop-row:last-child{border-bottom:0}
.owned{font-size:12px;color:var(--muted);white-space:nowrap}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.stat{background:var(--panel);padding:9px 12px;display:flex;flex-direction:column}
.stat small{color:var(--muted);font-size:11px}
.stat b{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.2}
.pad{padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:72px;margin-top:8px;font:12px ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);resize:vertical}
.muted{color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;max-width:420px;width:100%;max-height:82%;overflow:auto}
.box h3{margin:0 0 8px;font-family:"Pixelify Sans",system-ui,sans-serif;font-size:22px;color:var(--accent);font-weight:600}
.box ul{margin:6px 0 10px;padding-left:18px}
.box li{margin:3px 0}
.box .btn{width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){.float,.toast,.xpbar i,.chev{animation:none;transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><span class="logo">Wanderskill</span><small>idle skilling sim</small></div>
    <div class="hud-stats">
      <div class="pill gold">🪙 <b id="hud-gold">0</b></div>
      <div class="pill">Total <b id="hud-total">5</b></div>
    </div>
  </header>
  <section class="scene">
    <div class="scene-wrap" id="scene-wrap">
      <div class="canvas-box" id="canvas-box">
        <canvas id="game" width="384" height="288"></canvas>
        <div class="overlay" id="floats"></div>
        <div class="toasts" id="toasts"></div>
        <div class="hint" id="hint" hidden>👋 Tap the <b>rocks</b>, <b>tree</b>, <b>pond</b>, <b>furnace</b> or <b>campfire</b> to put your skiller to work.<br>Tap the grass while they work to lend a hand.</div>
      </div>
    </div>
    <div class="status"><span id="status-text">Pick a task to begin</span><div class="sbar"><i id="status-bar"></i></div></div>
  </section>
  <nav class="tabs" id="tabs">
    <button class="active" data-tab="skills">📜 Skills</button>
    <button data-tab="bank">🧺 Bank</button>
    <button data-tab="shop">🛒 Shop</button>
    <button data-tab="stats">📊 Stats</button>
  </nav>
  <main class="panel" id="panel"></main>
  <div class="modal" id="modal" hidden>
    <div class="box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <button class="btn primary" id="modal-ok">Nice</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= data ================= */
const W = 128, H = 96, SAVE_KEY = 'wanderskill_save_v1';
const SKILL_ORDER = ['mining', 'woodcutting', 'fishing', 'smithing', 'cooking'];
const SKILLS = {
  mining:      { name: 'Mining',      icon: '⛏️', color: '#d8a35a', verb: 'Mining',   tiers: ['Worn pickaxe', 'Copper pickaxe', 'Iron pickaxe', 'Steel pickaxe', 'Starsteel pickaxe', 'Emberite pickaxe'] },
  woodcutting: { name: 'Woodcutting', icon: '🪓', color: '#8fd36e', verb: 'Chopping', tiers: ['Worn axe', 'Copper axe', 'Iron axe', 'Steel axe', 'Starsteel axe', 'Emberite axe'] },
  fishing:     { name: 'Fishing',     icon: '🎣', color: '#7fc1ff', verb: 'Fishing',  tiers: ['Frayed rod', 'Birch rod', 'Oak rod', 'Yew rod', 'Moonwood rod', 'Elderwood rod'] },
  smithing:    { name: 'Smithing',    icon: '⚒️', color: '#c9bde6', verb: 'Smelting', tiers: ['Worn hammer', 'Copper hammer', 'Iron hammer', 'Steel hammer', 'Starsteel hammer', 'Emberite hammer'] },
  cooking:     { name: 'Cooking',     icon: '🍳', color: '#ff9b6a', verb: 'Cooking',  tiers: ['Sharp stick', 'Iron skillet', 'Steel skillet', 'Silver skillet', 'Gold skillet', 'Emberite skillet'] },
};
const ACTIONS = {
  mining: [
    { id: 'copper_ore',    name: 'Copper Ore',    lvl: 1,  time: 2.4, xp: 12,  value: 3,   color: '#c8763a' },
    { id: 'tin_ore',       name: 'Tin Ore',       lvl: 6,  time: 2.6, xp: 16,  value: 4,   color: '#c9ccd1' },
    { id: 'iron_ore',      name: 'Iron Ore',      lvl: 15, time: 3.0, xp: 30,  value: 9,   color: '#9a6b55' },
    { id: 'coal',          name: 'Coal',          lvl: 30, time: 3.4, xp: 48,  value: 18,  color: '#3a3a3a' },
    { id: 'silver_ore',    name: 'Silver Ore',    lvl: 40, time: 3.6, xp: 62,  value: 30,  color: '#e6ecf2' },
    { id: 'gold_ore',      name: 'Gold Ore',      lvl: 50, time: 4.0, xp: 82,  value: 50,  color: '#f1c84b' },
    { id: 'starsteel_ore', name: 'Starsteel Ore', lvl: 65, time: 4.6, xp: 115, value: 92,  color: '#7fb3ff' },
    { id: 'duskite',       name: 'Duskite',       lvl: 80, time: 5.4, xp: 165, value: 165, color: '#7b4fa8' },
    { id: 'emberite',      name: 'Emberite',      lvl: 90, time: 6.4, xp: 235, value: 300, color: '#ff6b35' },
  ],
  woodcutting: [
    { id: 'birch_log',     name: 'Birch Log',     lvl: 1,  time: 2.2, xp: 10,  value: 2,   color: '#8fbf6a' },
    { id: 'oak_log',       name: 'Oak Log',       lvl: 10, time: 2.8, xp: 22,  value: 6,   color: '#5e9a3f' },
    { id: 'pine_log',      name: 'Pine Log',      lvl: 22, time: 3.1, xp: 36,  value: 12,  color: '#2f7a4a' },
    { id: 'maple_log',     name: 'Maple Log',     lvl: 38, time: 3.6, xp: 58,  value: 28,  color: '#d9732b' },
    { id: 'yew_log',       name: 'Yew Log',       lvl: 55, time: 4.2, xp: 90,  value: 60,  color: '#3b5d3a' },
    { id: 'ironbark_log',  name: 'Ironbark Log',  lvl: 70, time: 5.0, xp: 130, value: 110, color: '#6c6f7a' },
    { id: 'moonwood_log',  name: 'Moonwood Log',  lvl: 85, time: 6.0, xp: 190, value: 220, color: '#b9c7ff' },
    { id: 'elderwood_log', name: 'Elderwood Log', lvl: 95, time: 7.2, xp: 270, value: 400, color: '#e8c15a' },
  ],
  fishing: [
    { id: 'minnow',        name: 'Raw Minnow',        lvl: 1,  time: 2.5, xp: 10,  value: 2,   color: '#9fd0e8' },
    { id: 'trout',         name: 'Raw Trout',         lvl: 12, time: 3.0, xp: 25,  value: 7,   color: '#c98a6b' },
    { id: 'perch',         name: 'Raw Perch',         lvl: 25, time: 3.3, xp: 40,  value: 14,  color: '#8aa84f' },
    { id: 'salmon',        name: 'Raw Salmon',        lvl: 38, time: 3.8, xp: 60,  value: 26,  color: '#f28c74' },
    { id: 'pike',          name: 'Raw Pike',          lvl: 50, time: 4.2, xp: 85,  value: 48,  color: '#6d8f6a' },
    { id: 'sturgeon',      name: 'Raw Sturgeon',      lvl: 65, time: 5.0, xp: 125, value: 95,  color: '#7f8c99' },
    { id: 'glowfin',       name: 'Raw Glowfin',       lvl: 80, time: 5.8, xp: 175, value: 180, color: '#6ff2d2' },
    { id: 'leviathan_eel', name: 'Raw Leviathan Eel', lvl: 92, time: 7.0, xp: 250, value: 330, color: '#4a3f8f' },
  ],
  smithing: [
    { id: 'copper_bar',    name: 'Copper Bar',    lvl: 1,  time: 2.4, xp: 14,  value: 10,  inputs: { copper_ore: 1 },               color: '#c8763a' },
    { id: 'bronze_bar',    name: 'Bronze Bar',    lvl: 8,  time: 2.6, xp: 26,  value: 20,  inputs: { copper_ore: 1, tin_ore: 1 },   color: '#b08a4a' },
    { id: 'iron_bar',      name: 'Iron Bar',      lvl: 18, time: 3.0, xp: 36,  value: 26,  inputs: { iron_ore: 1 },                 color: '#9a8b85' },
    { id: 'steel_bar',     name: 'Steel Bar',     lvl: 32, time: 3.4, xp: 60,  value: 58,  inputs: { iron_ore: 1, coal: 1 },        color: '#aab4bd' },
    { id: 'silver_bar',    name: 'Silver Bar',    lvl: 42, time: 3.6, xp: 72,  value: 68,  inputs: { silver_ore: 1 },               color: '#e6ecf2' },
    { id: 'gold_bar',      name: 'Gold Bar',      lvl: 52, time: 4.0, xp: 96,  value: 112, inputs: { gold_ore: 1 },                 color: '#f1c84b' },
    { id: 'starsteel_bar', name: 'Starsteel Bar', lvl: 68, time: 4.6, xp: 150, value: 270, inputs: { starsteel_ore: 1, coal: 2 },   color: '#7fb3ff' },
    { id: 'duskite_bar',   name: 'Duskite Bar',   lvl: 82, time: 5.4, xp: 210, value: 480, inputs: { duskite: 1, coal: 3 },         color: '#7b4fa8' },
    { id: 'emberite_bar',  name: 'Emberite Bar',  lvl: 92, time: 6.4, xp: 300, value: 880, inputs: { emberite: 1, coal: 4 },        color: '#ff6b35' },
  ],
};
ACTIONS.cooking = ACTIONS.fishing.map(f => ({
  id: 'cooked_' + f.id, name: f.name.replace('Raw ', 'Cooked '), lvl: f.lvl, time: +(f.time * 0.7).toFixed(2),
  xp: Math.round(f.xp * 1.2), value: f.value * 2 + 1, inputs: { [f.id]: 1 }, color: f.color, burn: true,
}));
const ITEMS = {}, ACTION_BY_ID = {};
for (const s of SKILL_ORDER) for (const a of ACTIONS[s]) { a.skill = s; ACTION_BY_ID[a.id] = a; ITEMS[a.id] = { name: a.name, value: a.value, color: a.color, cat: s }; }
ITEMS.burnt_fish = { name: 'Burnt Fish', value: 1, color: '#2b2b2b', cat: 'burnt' };
const CAT_ICON = { mining: '🪨', woodcutting: '🪵', fishing: '🐟', smithing: '🔶', cooking: '🍽️', burnt: '🖤' };

const TOOL_MULT = [1, 1.15, 1.32, 1.52, 1.75, 2.0];
const TOOL_COST = [0, 120, 700, 3500, 18000, 90000];
const APPRENTICES = [
  { name: 'Pip',  tunic: '#2e86ab', hair: '#d9a441', cost: 1500 },
  { name: 'Tam',  tunic: '#6a994e', hair: '#2b1d14', cost: 12000 },
  { name: 'Wren', tunic: '#8e44ad', hair: '#8b4a2b', cost: 90000 },
];
const TRAIN_EFF = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0];
const TRAIN_COST = [800, 2400, 7200, 21600, 64800];
const SCHOLAR_MAX = 10, MERCHANT_MAX = 10, AUTOSELL_COST = 4000;
const scholarCost = n => Math.round(400 * Math.pow(2.2, n));
const merchantCost = n => Math.round(300 * Math.pow(2.4, n));

function sanitize(d) {

    s.xp[k] = clamp(num(d.xp && d.xp[k]), 0, MAX_XP);
    s.tools[k] = clampInt(d.tools && d.tools[k], 0, 5);
  }
  if (d.bank && typeof d.bank === 'object') for (const [k, v] of Object.entries(d.bank)) if (ITEMS[k] && num(v) > 0) s.bank[k] = Math.floor(num(v));
  if (d.up) {
    s.up.scholar = clampInt(d.up.scholar, 0, SCHOLAR_MAX); s.up.merchant = clampInt(d.up.merchant, 0, MERCHANT_MAX);
    s.up.autosell = !!d.up.autosell; s.up.rest = clampInt(d.up.rest, 0, REST.length - 1); s.up.train = clampInt(d.up.train, 0, TRAIN_EFF.length - 1);

    const w = ws[i] || {};
    const a = w.task && ACTION_BY_ID[w.task.id];
    const task = a && levelFor(s.xp[a.skill]) >= a.lvl ? { skill: a.skill, id: a.id } : null;
    s.workers.push({ task, progress: clamp(num(w.progress), 0, 1) });

  if (d.stats) for (const k of Object.keys(s.stats)) s.stats[k] = Math.max(0, num(d.stats[k]));

}

  for (const a of ACTIONS[skill]) if (a.lvl > before && a.lvl <= after) toast(`Unlocked: ${a.name}`);
  if (after === 99) toast(`🎉 ${S.name} mastered. You've earned the ${S.name} cloak.`, true);

function xpRate(s) {

/* ================= simulation ================= */
function addRuntimeWorker(i, pop) {
  const sw = state.workers[i];
  const home = HOME_SPOTS[i % HOME_SPOTS.length];
  let x = home.x, y = home.y, facing = i % 2 ? -1 : 1;
  if (sw.task) { const n = NODES[sw.task.skill]; x = n.stand.x; y = n.stand.y; facing = n.face; }
  RT.workers[i] = { x, y, home, target: { x, y }, facing, state: 'idle', animT: Math.random() * 10, lastFrame: 0, wanderT: 2 + Math.random() * 3 };
  if (pop) burst(x, y - 6, '#f4c542', 14);
}
function moveToward(w, tgt, dt, speed) {
  const dx = tgt.x - w.x, dy = tgt.y - w.y, d = Math.hypot(dx, dy);
  if (d <= speed * dt) { w.x = tgt.x; w.y = tgt.y; return true; }
  w.x += dx / d * speed * dt; w.y += dy / d * speed * dt;
  if (Math.abs(dx) > 0.3) w.facing = dx > 0 ? 1 : -1;
  return false;
}
function updateWorker(i, dt) {
  const w = RT.workers[i], sw = state.workers[i];
  w.animT += dt;
  if (!sw.task) {
    if (Math.hypot(w.target.x - w.x, w.target.y - w.y) > 0.5) { w.state = 'walking'; moveToward(w, w.target, dt, 12); }
    else {
      w.state = 'idle'; w.wanderT -= dt;
      if (w.wanderT <= 0) {
        w.wanderT = 3 + Math.random() * 5;
        w.target = { x: clamp(w.home.x + (Math.random() * 18 - 9), 44, 92), y: clamp(w.home.y + (Math.random() * 10 - 5), 46, 66) };
      }
    }
    return;
  }
  const a = ACTION_BY_ID[sw.task.id], node = NODES[a.skill], st = node.stand;
  if (Math.hypot(st.x - w.x, st.y - w.y) > 0.5) { w.state = 'walking'; moveToward(w, st, dt, 26); return; }
  w.x = st.x; w.y = st.y; w.facing = node.face;
  if (a.inputs && maxCraftable(a) <= 0) { w.state = 'waiting'; return; }
  w.state = 'working';
  sw.progress += dt / actionTime(i, a);
  const fr = Math.floor(w.animT * 4) % 2;
  if (fr !== w.lastFrame) { w.lastFrame = fr; if (fr === 1) workParticles(w, a); }
  if (sw.progress >= 1) {
    const n = Math.floor(sw.progress);
    const done = completeAction(i, a, n);
    if (done > 0) { sw.progress -= done; onActionDone(w, a, done); }
    if (done < n) { sw.progress = Math.min(sw.progress, 1); w.state = 'waiting'; }
  }
}
function onActionDone(w, a, done) {
  floatText(`+${fmtXp(a.xp * xpMult() * done)} xp`, w.x, w.y - 15, SKILLS[a.skill].color);
}
function step(dt) {
  state.stats.playtime += dt;
  for (let i = 0; i < RT.workers.length; i++) updateWorker(i, dt);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.life -= dt;
    if (p.life <= 0) { P.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function bulk(seconds) {
  const cap = REST[state.up.rest].h * 3600, sim = Math.min(seconds, cap);
  const sum = { away: seconds, sim, capped: seconds > cap + 1, items: {}, xpBefore: {}, lvlBefore: {}, goldBefore: state.gold, any: false };
  for (const s of SKILL_ORDER) { sum.xpBefore[s] = state.xp[s]; sum.lvlBefore[s] = lvl(s); }
  const idx = state.workers.map((w, i) => i).filter(i => state.workers[i].task);
  idx.sort((i, j) => (ACTION_BY_ID[state.workers[i].task.id].inputs ? 1 : 0) - (ACTION_BY_ID[state.workers[j].task.id].inputs ? 1 : 0));
  for (const i of idx) {
    const sw = state.workers[i], a = ACTION_BY_ID[sw.task.id], w = RT.workers[i], node = NODES[a.skill];
    w.x = node.stand.x; w.y = node.stand.y; w.target = { x: w.x, y: w.y }; w.facing = node.face;
    const prog = sw.progress + sim / actionTime(i, a), n = Math.floor(prog);
    const done = n > 0 ? completeAction(i, a, n) : 0;
    sw.progress = done < n ? 1 : prog - n;
    if (done > 0) { sum.items[a.id] = (sum.items[a.id] || 0) + done; sum.any = true; }
  }
  return sum;
}

    const tier = state.tools[s], S = SKILLS[s];
    if (tier >= 5) tools += shopRow(`${S.icon} ${S.tiers[5]}`, `${S.name} at full speed`, 'tool', s, 0, 'Maxed');
    else tools += shopRow(`${S.icon} ${S.tiers[tier + 1]}`, `${S.name} ${Math.round((TOOL_MULT[tier + 1] - 1) * 100)}% faster than base${s === 'cooking' ? ', 5% less burning' : ''}${tier ? ` (now ${Math.round((TOOL_MULT[tier] - 1) * 100)}%)` : ''}`, 'tool', s, TOOL_COST[tier + 1]);
  }
  root.appendChild(el(`<div class="card"><div class="card-title">Tools<small>faster actions</small></div>${tools}</div>`));
  let crew = '';
  if (state.hired < APPRENTICES.length) { const ap = APPRENTICES[state.hired]; crew += shopRow(`Hire ${ap.name}`, `A second pair of hands for any skill, working at ${Math.round(TRAIN_EFF[state.up.train] * 100)}% speed`, 'hire', '', ap.cost); }
  else crew += shopRow('Camp is full', 'Three apprentices is the most your camp can feed', 'hire', '', 0, 'Full');
  if (state.hired > 0) {
    const t = state.up.train;
    crew += t >= TRAIN_EFF.length - 1 ? shopRow('Apprentice training', 'Apprentices work at full speed', 'train', '', 0, 'Maxed') : shopRow('Apprentice training', `Apprentices work at ${Math.round(TRAIN_EFF[t + 1] * 100)}% speed (now ${Math.round(TRAIN_EFF[t] * 100)}%)`, 'train', '', TRAIN_COST[t]);
  }
  root.appendChild(el(`<div class="card"><div class="card-title">Crew<small>more hands, more progress</small></div>${crew}</div>`));
  const sc = state.up.scholar, me = state.up.merchant;
  let know = sc >= SCHOLAR_MAX ? shopRow("Scholar's Guide", 'All volumes collected: +80% XP', 'scholar', '', 0, 'Maxed') : shopRow(`Scholar's Guide vol. ${sc + 1}`, `+8% XP in every skill${sc ? ` (now +${sc * 8}%)` : ''}`, 'scholar', '', scholarCost(sc));
  know += me >= MERCHANT_MAX ? shopRow("Merchant's Favor", 'Sell prices doubled', 'merchant', '', 0, 'Maxed') : shopRow(`Merchant's Favor ${me + 1}`, `+10% sell prices${me ? ` (now +${me * 10}%)` : ''}`, 'merchant', '', merchantCost(me));
  know += state.up.autosell ? shopRow('Auto-sell', 'Gathered items sell themselves', 'autosell', '', 0, 'Owned') : shopRow('Auto-sell', 'Gathered items sell themselves; anything your smiths and cooks need is kept', 'autosell', '', AUTOSELL_COST);
  const r = state.up.rest;
  know += r >= REST.length - 1 ? shopRow('Long rest', 'Your crew works a full day while you are away', 'rest', '', 0, 'Maxed') : shopRow('Longer rest', `Crew keeps working up to ${REST[r + 1].h}h while you're away (now ${REST[r].h}h)`, 'rest', '', REST[r + 1].cost);
  root.appendChild(el(`<div class="card"><div class="card-title">Knowledge &amp; trade</div>${know}</div>`));
  return root;
}
function updateShop() { for (const b of panel.querySelectorAll('[data-cost]')) b.disabled = state.gold < +b.dataset.cost; }
function buildStats() {
  const root = el('<div></div>');
  const mastered = SKILL_ORDER.filter(s => lvl(s) >= 99).map(s => SKILLS[s].icon).join(' ') || '—';
  root.appendChild(el(`<div class="card"><div class="stat-grid">
    <div class="stat"><small>Total level</small><b id="st-total"></b></div>
    <div class="stat"><small>Total XP</small><b id="st-xp"></b></div>
    <div class="stat"><small>Gold earned</small><b id="st-gold"></b></div>
    <div class="stat"><small>Actions done</small><b id="st-actions"></b></div>
    <div class="stat"><small>Items sold</small><b id="st-sold"></b></div>
    <div class="stat"><small>Fish burnt</small><b id="st-burnt"></b></div>
    <div class="stat"><small>Time at camp</small><b id="st-time"></b></div>
    <div class="stat"><small>Level-ups</small><b id="st-lvlups"></b></div>
    <div class="stat"><small>Crew</small><b>${state.workers.length}</b></div>
    <div class="stat"><small>Mastered</small><b>${mastered}</b></div>
  </div></div>`));
  root.appendChild(el(`<div class="card"><div class="card-title">Save<small>${ui.noStorage ? 'storage blocked in this browser' : 'saves automatically here'}</small></div><div class="pad"><div class="row"><button class="btn" data-act="export">Export code</button><button class="btn" data-act="import">Import code</button><button class="btn danger" data-act="reset" id="reset-btn">Reset camp</button></div><textarea id="savebox" placeholder="Export writes a save code here. Paste one and tap Import to load it on another device." spellcheck="false"></textarea>${ui.noStorage ? '<p class="muted">⚠️ This browser is blocking local storage, so progress will be lost when you leave. Export a save code to keep it.</p>' : ''}</div></div>`));
  root.appendChild(el(`<p class="muted" style="text-align:center">An original idle skiller for people who remember the long road to 99.</p>`));
  return root;
}
function updateStats() {
  const e = $('st-total'); if (!e) return;
  e.textContent = totalLevel();
  $('st-xp').textContent = fmtXp(SKILL_ORDER.reduce((t, s) => t + state.xp[s], 0));
  $('st-gold').textContent = fmtG(state.stats.goldEarned);
  $('st-actions').textContent = fmtG(state.stats.actions);
  $('st-sold').textContent = fmtG(state.stats.itemsSold);
  $('st-burnt').textContent = fmtG(state.stats.burnt);
  $('st-time').textContent = fmtDur(state.stats.playtime);
  $('st-lvlups').textContent = fmtG(state.stats.levelups);
}
function buildTab(tab) {
  panel.innerHTML = '';
  panel.appendChild(tab === 'skills' ? buildSkills() : tab === 'bank' ? buildBank() : tab === 'shop' ? buildShop() : buildStats());
}
function updateTab(tab) {
  if (tab === 'skills') updateSkills(); else if (tab === 'bank') updateBank(); else if (tab === 'shop') updateShop(); else updateStats();
}
function updateHud() {
  $('hud-gold').textContent = fmtG(state.gold);
  $('hud-total').textContent = totalLevel();
  const i = state.sel, sw = state.workers[i], w = RT.workers[i], name = lookOf(i).name;
  let text, prog = 0;
  if (!sw.task) text = `${name}: idle. Tap a spot in the world to start.`;
  else {
    const a = ACTION_BY_ID[sw.task.id];
    prog = sw.progress;
    if (w.state === 'walking') text = `${name}: heading to the ${NODES[a.skill].label}`;
    else if (w.state === 'waiting') text = `${name}: waiting for ${Object.keys(a.inputs).map(id => ITEMS[id].name).join(' and ')}`;
    else text = `${name}: ${SKILLS[a.skill].icon} ${SKILLS[a.skill].verb} ${a.name}`;
  }
  $('status-text').textContent = text;
  $('status-bar').style.width = (clamp(prog, 0, 1) * 100) + '%';
}
function uiTick() {
  if (ui.dirty) { ui.dirty = false; buildTab(ui.tab); }
  updateTab(ui.tab);
  updateHud();
}
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'toggle': { const card = b.closest('.card'); const open = !ui.open.has(d.skill); if (open) ui.open.add(d.skill); else ui.open.delete(d.skill); card.classList.toggle('open', open); card.querySelector('.actions').hidden = !open; break; }
    case 'assign': assign(state.sel, d.id); break;
    case 'stop': stopTask(+d.w); break;
    case 'selw': selectWorker(+d.w); break;
    case 'tab': setTab(d.tab); break;
    case 'sell': { const n = state.bank[d.id] || 0; if (n > 0) { const v = sellItem(d.id, n); delete state.bank[d.id]; toast(`Sold ${fmtG(n)} ${ITEMS[d.id].name} for ${fmtG(v)}g`); ui.dirty = true; save(); } break; }
    case 'sellall': { const reserved = reservedItems(); let total = 0, count = 0; for (const [id, n] of Object.entries(state.bank)) { if (reserved.has(id) || n <= 0) continue; total += sellItem(id, n); count += n; delete state.bank[id]; } toast(count ? `Sold ${fmtG(count)} items for ${fmtG(total)}g` : 'Nothing to sell'); ui.dirty = true; save(); break; }
    case 'autosell': toast('Auto-sell stays on once bought — stock up by assigning smiths or cooks to the items you want kept.'); break;
    case 'buy': buy(d.kind, d.arg); break;
    case 'export': { const box = $('savebox'); box.value = encodeSave(); box.focus(); box.select(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => toast('Save code copied'), () => toast('Save code ready — copy it from the box')); else toast('Save code ready — copy it from the box'); break; }
    case 'import': { const box = $('savebox'); try { const s = decodeSave(box.value); if (!box.value.trim()) throw new Error('empty'); applyState(s, false); toast('Save loaded', true); } catch (err) { toast('That code didn\'t load. Paste the whole code, starting with WS1.'); } break; }
    case 'reset': { const now = Date.now(); if (now - ui.resetArmed < 4000) { applyState(defaultState(), false); ui.resetArmed = 0; toast('Camp reset. Fresh start!'); } else { ui.resetArmed = now; b.textContent = 'Tap again to confirm'; setTimeout(() => { if (b.isConnected) b.textContent = 'Reset camp'; }, 4000); } break; }
  }
});

/* ================= boot ================= */
function applyState(s, offline) {
  state = s;
  RT.workers = [];
  for (let i = 0; i < state.workers.length; i++) addRuntimeWorker(i, false);
  P.length = 0;
  ui.open = new Set([state.workers[state.sel].task ? state.workers[state.sel].task.skill : 'mining']);
  $('hint').hidden = state.seenHint;
  if (offline) {
    const away = Math.max(0, (Date.now() - state.lastSave) / 1000);
    if (away > 5) { const sum = bulk(away); if (away > 90 && sum.any) showWelcome(sum); }
  }
  ui.dirty = true; save();
}
function showWelcome(sum) {
  const sk = SKILL_ORDER.filter(s => state.xp[s] > sum.xpBefore[s]).map(s => { const l0 = sum.lvlBefore[s], l1 = lvl(s); return `<li>${SKILLS[s].icon} ${SKILLS[s].name}: +${fmtXp(state.xp[s] - sum.xpBefore[s])} xp${l1 > l0 ? ` — level ${l0} → <b>${l1}</b>` : ''}</li>`; }).join('');
  const it = Object.entries(sum.items).map(([id, n]) => `<li>${CAT_ICON[ITEMS[id].cat]} ${ITEMS[id].name} ×${n.toLocaleString()}</li>`).join('');
  const gold = state.gold - sum.goldBefore;
  let html = `<p>You were away for <b>${fmtDur(sum.away)}</b>.${sum.capped ? ` Your crew kept at it for <b>${fmtDur(sum.sim)}</b> of that — a longer rest can be bought in the Shop.` : ' Your crew kept at it the whole time.'}</p>`;
  html += `<ul>${sk}</ul>${it ? `<p class="muted">Produced</p><ul>${it}</ul>` : ''}${gold > 0 ? `<p>🪙 +${fmtG(gold)} gold from auto-sell</p>` : ''}`;
  openModal('Welcome back', html, 'Back to work');
}
buildTerrain();
resize();
window.addEventListener('resize', resize);
applyState(load() || defaultState(), true);
if (!state.seenHint) $('hint').hidden = false;

let last = performance.now(), uiAcc = 0, saveAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt <= 0) return;
  if (dt > 3) bulk(dt); else step(dt);
  render(now / 1000);
  uiAcc += dt; if (uiAcc >= 0.1) { uiAcc = 0; uiTick(); }
  saveAcc += dt; if (saveAcc >= 5) { saveAcc = 0; save(); }
}
uiTick();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);
})();
</script>
</body>
</html>
