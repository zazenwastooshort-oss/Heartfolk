<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthfolk — a living village chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --panel:rgba(249,243,229,.86); --panel2:rgba(236,225,200,.9); --text:#2a2217; --muted:#6c5f50; --border:rgba(90,70,40,.22);
  --accent:#a8641c; --spark:#e4a42a; --good:#3e8b3f; --bad:#b4433a; --ink:#2a2217;
  --shadow:0 6px 24px rgba(20,15,5,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --panel:rgba(22,24,20,.78); --panel2:rgba(40,42,34,.9); --text:#f1e9d8; --muted:#b0a695; --border:rgba(255,240,200,.16); --accent:#f0c36a; --spark:#f7c75a; --good:#8fd27f; --bad:#f08a80; --ink:#f1e9d8; --shadow:0 6px 24px rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --panel:rgba(22,24,20,.78); --panel2:rgba(40,42,34,.9); --text:#f1e9d8; --muted:#b0a695; --border:rgba(255,240,200,.16); --accent:#f0c36a; --spark:#f7c75a; --good:#8fd27f; --bad:#f08a80; --ink:#f1e9d8; --shadow:0 6px 24px rgba(0,0,0,.45); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#1d3320;color:var(--text);overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:clamp(13px,.55vw + 10px,19px);line-height:1.35;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#ui{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));transition:opacity .6s}
#ui>*{pointer-events:auto}
.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:inherit;pointer-events:none}
.top>*{pointer-events:auto}
.title{padding:8px 14px 9px}
.name{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.9em;line-height:1.05;background:none;border:0;color:var(--text);padding:0;cursor:text;text-align:left;font-variation-settings:"opsz" 144}
.name:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.sub{color:var(--muted);font-size:.95em;margin-top:2px}
.sub b{color:var(--text);font-weight:600}
.res{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:60vw}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{color:var(--muted)}
.chip.full b{color:var(--bad)}
.ticker{position:absolute;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,720px);padding:8px 14px;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ticker span{color:var(--muted);margin-right:8px}
.controls{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:5px}
.controls button,.dock button,.sheet button,.card button{font:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 11px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.controls button.on{background:var(--panel2);border-color:var(--border)}
.controls button:hover,.dock button:hover{background:var(--panel2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:8px 10px;min-width:180px}
.dock.left{left:calc(10px + env(safe-area-inset-left,0px))}
.dock.right{right:calc(10px + env(safe-area-inset-right,0px));min-width:150px}
.dock h4{margin:0;font-weight:600;font-size:.95em;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.dock h4 small{color:var(--muted);font-weight:400}
.dock.closed .body{display:none}
#prio.closed h4 small{display:none}
body.sheet-open .dock.right,body.sheet-open .ticker{opacity:0;pointer-events:none}
.prow{display:flex;align-items:center;gap:8px;font-size:.92em}
.prow span{flex:1}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:16px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;touch-action:manipulation}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.spark{display:flex;align-items:center;gap:8px;font-size:.92em}
.sparkbar{flex:1;height:8px;border-radius:4px;background:rgba(128,110,80,.25);overflow:hidden}
.sparkbar i{display:block;height:100%;background:var(--spark);width:0}
.bless{display:grid;grid-template-columns:1fr;gap:4px}
.bless button{text-align:left;border:1px solid var(--border);padding:6px 9px;font-size:.9em;display:flex;justify-content:space-between;gap:8px}
.bless button:disabled{opacity:.45;cursor:default}
.bless button small{color:var(--muted)}
.card{position:absolute;padding:12px 14px;width:min(92vw,400px)}
.card.petition{left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);border-color:var(--spark)}
.card.inspector{left:calc(10px + env(safe-area-inset-left,0px));top:calc(92px + env(safe-area-inset-top,0px));max-height:calc(100vh - 300px);overflow:auto}
.card h3{margin:0 0 4px;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.25em}
.card p{margin:4px 0 8px;color:var(--text)}
.card .muted{color:var(--muted);font-size:.92em}
.card .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card .opts button{border:1px solid var(--border);background:var(--panel2)}
.card .opts button.primary{background:var(--accent);color:#fff8ea;border-color:transparent}
.timer{height:4px;background:rgba(128,110,80,.25);border-radius:2px;margin-top:10px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--spark);width:100%}
.phead{display:flex;gap:12px;align-items:center}
.phead canvas{width:56px;height:56px;border-radius:12px;background:var(--panel2);flex:none}
.phead div{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.92em;margin:8px 0}
.kv small{color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:.85em;align-items:center}
.bar{height:6px;border-radius:3px;background:rgba(128,110,80,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.traits span{font-size:.82em;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border)}
.story{margin:6px 0 0;padding-left:16px;font-size:.88em;color:var(--muted)}
.story li{margin:2px 0}
.cardbtns{display:flex;gap:6px;margin-top:8px}
.cardbtns button{border:1px solid var(--border);background:var(--panel2)}
.sheet{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.sheet header h3{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.3em}
.sheet .body{overflow:auto;padding:8px 14px 14px;flex:1}
.sheet .tabs{display:flex;gap:4px;padding:8px 10px 0}
.sheet .tabs button{border:1px solid transparent}
.sheet .tabs button.on{background:var(--panel2);border-color:var(--border)}
.yr{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:10px 0 4px;font-size:1.05em}
.ent{display:flex;gap:8px;padding:4px 0;font-size:.93em;border-bottom:1px dashed var(--border)}
.ent .ic{width:20px;text-align:center;flex:none}
.ent .when{color:var(--muted);min-width:68px;flex:none;font-size:.9em}
.disc{padding:6px 0;border-bottom:1px dashed var(--border);font-size:.93em}
.disc.locked{color:var(--muted)}
.set{display:flex;flex-direction:column;gap:8px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.95em}
.set button,.set input{font:inherit}
.set input[type=text],.set textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);-webkit-user-select:text;user-select:text}
.set textarea{min-height:64px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em}
.set .rowb{display:flex;gap:6px;flex-wrap:wrap}
.set .rowb button{border:1px solid var(--border);background:var(--panel2)}
.toggle{width:40px;height:22px;border-radius:11px;background:rgba(128,110,80,.3);border:0;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--good)}
.toggle.on::after{left:20px}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;color:#fff8ea;text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.4);animation:banner 5s ease forwards}
.banner h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(28px,4.5vw,64px);margin:0;letter-spacing:.3px}
.banner p{margin:6px 0 0;font-size:clamp(14px,1.4vw,22px);opacity:.9}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-46%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,12,8,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .box{padding:16px 18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 8px;font-family:"Fraunces",Georgia,serif;font-size:1.4em;font-weight:600}
.modal ul{margin:6px 0 10px;padding-left:18px}
.modal button{width:100%;font:inherit;padding:9px;border-radius:10px;border:0;background:var(--accent);color:#fff8ea;cursor:pointer;font-weight:600}
[hidden]{display:none !important}
#ui .dock,#ui .controls,#ui .inspector,#ui .sheet,#ui .top,#ui .ticker{transition:opacity .8s}
body.ambient .dock,body.ambient .controls,body.ambient .inspector,body.ambient .sheet{opacity:0;pointer-events:none}
body.ambient .top{opacity:.8}
body.ambient .ticker{opacity:.9}
@media (max-width:720px){
  .title{padding:6px 10px 7px;max-width:46vw}
  .name{font-size:1.3em}
  .sub{font-size:.8em}
  .res{max-width:52vw;gap:4px}
  .chip{padding:3px 7px;font-size:.82em;gap:4px}
  .dock{bottom:calc(100px + env(safe-area-inset-bottom,0px));min-width:0;padding:7px 9px}
  .dock .body{margin-top:2px}
  .dock.closed h4 small{display:inline}
  .bless button{padding:5px 8px}
  .ticker{bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 20px);font-size:.85em;padding:7px 10px}
  .card.inspector{left:50%;top:auto;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-height:46vh}
  .card.petition{top:calc(150px + env(safe-area-inset-top,0px));width:calc(100vw - 20px)}
  .sheet{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));width:auto;top:calc(150px + env(safe-area-inset-top,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .banner h2{font-size:clamp(24px,8vw,40px)}
}
@media (prefers-reduced-motion:reduce){.banner{animation-duration:1s}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="ui">
  <div class="top">
    <div class="panel title">
      <button class="name" id="name" title="Rename">Fernhollow</button>
      <div class="sub" id="sub"></div>
    </div>
    <div class="res" id="res"></div>
  </div>

  <aside class="panel dock left" id="prio">
    <h4>Priorities <small id="prio-hint">tap to change</small></h4>
    <div class="body" id="prio-body"></div>
  </aside>

  <aside class="panel dock right" id="bless">
    <h4>Blessings <small id="spark-txt"></small></h4>
    <div class="body">
      <div class="spark"><span>Spark</span><div class="sparkbar"><i id="sparkbar"></i></div></div>
      <div class="bless" id="bless-body"></div>
    </div>
  </aside>

  <div class="panel ticker" id="ticker"><span id="ticker-when"></span><em id="ticker-text">The fire is lit.</em></div>

  <div class="panel controls" id="controls">
    <button data-c="pause" title="Pause">⏸</button>
    <button data-c="s1" class="on">1×</button>
    <button data-c="s2">2×</button>
    <button data-c="s4">4×</button>
    <button data-c="fit" title="Show whole village">⤢</button>
    <button data-c="chron">📜 Chronicle</button>
    <button data-c="settings">⚙</button>
  </div>

  <div class="panel card petition" id="petition" hidden></div>
  <div class="panel card inspector" id="inspector" hidden></div>

  <div class="panel sheet" id="chron" hidden>
    <header><h3 id="chron-title">Chronicle</h3><button data-c="closechron">✕</button></header>
    <div class="tabs"><button class="on" data-ct="log">Events</button><button data-ct="people">People</button><button data-ct="disc">Discoveries</button></div>
    <div class="body" id="chron-body"></div>
  </div>

  <div class="panel sheet" id="settings" hidden>
    <header><h3>Settings</h3><button data-c="closesettings">✕</button></header>
    <div class="body set" id="settings-body"></div>
  </div>

  <div id="banner-slot"></div>
  <div class="modal" id="modal" hidden><div class="panel box"><h3 id="modal-title"></h3><div id="modal-body"></div><button id="modal-ok">Back to the village</button></div></div>
</div>

<script>
(() => {
'use strict';
/* ====================== constants ====================== */
const WW = 1600, WH = 900, HORIZON = 120, CELL = 50, GX = WW / CELL, GY = WH / CELL;
const DAY = 30, SEASON_DAYS = 5, YEAR_DAYS = SEASON_DAYS * 4;
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const SAVE_KEY = 'hearthfolk_save_v1';
const RIVER_W = 34, CARRY = 5;
const NAMES_F = ['Ada', 'Bea', 'Cora', 'Dessa', 'Elin', 'Fen', 'Greta', 'Hilde', 'Isa', 'Juno', 'Kit', 'Lena', 'Mira', 'Nora', 'Orla', 'Pia', 'Quill', 'Rosa', 'Sef', 'Tova', 'Ulla', 'Vida', 'Wren', 'Yara', 'Zia', 'Esme', 'Liv', 'Maren', 'Oda', 'Signe', 'Thea', 'Ines'];

  { n: 'City', pop: 55, need: { workshop: 1, market: 1, monument: 1 } },
];
const DISCOVERIES = [
  { id: 'tools', at: 20, name: 'Hardened tools', text: 'Fire-hardened handles and sharper edges. All work goes faster.' },
  { id: 'nets', at: 45, name: 'Fishing nets', text: 'Woven nets pull far more from the water than a line ever did.' },
  { id: 'rotation', at: 80, name: 'Crop rotation', text: 'Resting the soil between plantings makes the farms generous.' },
  { id: 'masonry', at: 130, name: 'Masonry', text: 'Stone fitted to stone. Buildings rise faster and stand longer.' },
  { id: 'writing', at: 200, name: 'Writing', text: 'The chronicle moves from memory to marks. Knowledge accumulates.' },
  { id: 'calendar', at: 300, name: 'Calendar', text: 'The year is counted and planned. Farms are sown at the best moment.' },
  { id: 'medicine', at: 450, name: 'Medicine', text: 'Herbs, rest and care. Elders live longer and sickness is milder.' },
];
const BLESSINGS = [
  { id: 'inspire', name: 'Inspire', icon: '✨', text: 'Everyone works half again as fast for two days.' },
  { id: 'bounty', name: 'Bounty', icon: '🌿', text: 'Berries swell, fish rise and farms surge for two days.' },
  { id: 'gather', name: 'Gather round', icon: '🔥', text: 'A night of stories at the fire. Spirits lift and friendships deepen.' },

const BUBBLE = { gather: '🧺', fish: '🎣', chop: '🪓', quarry: '⛏️', build: '🔨', eat: '🍎', sleep: '💤', chat: '💬', explore: '🧭', learn: '📖', craft: '🔧', farm: '🌱', play: '🎈', pray: '🕯️', wander: null, idle: null };

/* ====================== helpers ====================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pickR = arr => arr[Math.floor(Math.random() * arr.length)];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const r = mulberry32(seed), g = new Float32Array(64 * 64);

  const w = screenToWorld(sx, sy); const z = R.cam.z;
  let best = null, bd = 1e9;
  for (const v of S.villagers) { if (v.inside) continue; const d = Math.hypot(v.x - w.x, v.y - (w.y + 12)); if (d < 18 && d < bd) { bd = d; best = v; } }
  if (best) { R.sel = best; renderInspector(); return; }
  for (const b of S.buildings) { const B = BUILD[b.type]; if (w.x > b.x - B.w / 2 && w.x < b.x + B.w / 2 && w.y > b.y - B.h && w.y < b.y + 6) { R.sel = b; R.follow = null; renderInspector(); return; } }
  for (const s of S.sites) if (w.x > s.x - s.w / 2 && w.x < s.x + s.w / 2 && w.y > s.y - s.h && w.y < s.y + 8) { R.sel = s; R.follow = null; renderInspector(); return; }
  for (const list of [S.trees, S.bushes, S.rocks]) for (const e of list) { const d = Math.hypot(e.x - w.x, e.y - (w.y + 10)); if (d < 16 && d < bd) { bd = d; best = e; } }
  if (best && explored(best.x, best.y)) { R.sel = best; R.follow = null; renderInspector(); return; }
  if (R.sel) { R.sel = null; R.follow = null; renderInspector(); return; }
  setBeacon(w.x, w.y);
}
window.addEventListener('keydown', e => { if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return; if (e.code === 'Space') { e.preventDefault(); R.paused = !R.paused; $('controls').querySelector('[data-c=pause]').classList.toggle('on', R.paused); } if (e.key === 'Escape') { R.sel = null; R.follow = null; renderInspector(); $('chron').hidden = true; $('settings').hidden = true; syncSheets(); } });

/* ====================== save / load / boot ====================== */
function save() { S.lastSave = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null; const d = JSON.parse(raw); if (!d || !d.villagers || !d.fog) return null; return d; } catch (e) { return null; } }
function loadState(d, offline) {
  const fresh = newState();
  S = Object.assign(fresh, d);
  S.res = Object.assign(fresh.res, d.res || {}); S.prio = Object.assign(fresh.prio, d.prio || {}); S.buffs = Object.assign(fresh.buffs, d.buffs || {}); S.stats = Object.assign(fresh.stats, d.stats || {}); S.settings = Object.assign(fresh.settings, d.settings || {});
  if (!Array.isArray(S.fog) || S.fog.length !== GX * GY) S.fog = fresh.fog;
  for (const v of S.villagers) { v.act = null; v.inside = null; v.torch = false; v.bubble = null; if (!v.story) v.story = []; if (!v.friends) v.friends = {}; if (!v.skills) v.skills = { gather: 1, build: 1, farm: 1, craft: 1, lore: 1 }; }
  R.vById = new Map(S.villagers.map(v => [v.id, v]));
  R.petition = null; R.sel = null; R.follow = null; R.particles.length = 0; R.fx.length = 0; R.groundDirty = true; R.fogDirty = true;
  computeExplored(); buildDocks(); renderPetition(); renderInspector();
  if (offline) { const away = Math.max(0, (Date.now() - (S.lastSave || Date.now())) / 1000); if (away > 60) { const rep = bulkSim(away); if (rep.sim > 30) showWelcome(rep); } }
  refreshHud(); save();
}
function showWelcome(rep) {
  const lines = rep.lines.map(l => `<li>${esc(l)}</li>`).join('');
  $('modal-title').textContent = 'While you were away';
  $('modal-body').innerHTML = `<p>${fmtDur(rep.away)} passed${rep.capped ? `, and the village lived through ${fmtDur(rep.sim)} of it` : ''}. ${rep.popBefore === rep.popAfter ? `${S.name} still numbers ${rep.popAfter}.` : `${S.name} went from ${rep.popBefore} to ${rep.popAfter} people.`}</p>${lines ? `<ul>${lines}</ul>` : ''}`;
  $('modal').hidden = false;
}
function startNew() { S = newState(); genWorld(); loadState(S, false); fitCamera(); banner(S.name, 'A fire is lit by the river'); }
function initRuntime() {
  const r = mulberry32(7);
  R.stars = Array.from({ length: 90 }, () => ({ x: r() * WW * 3 - WW, y: r() * (HORIZON - 30) - 60, r: 0.8 + r() * 1.4, p: r() * 6 }));
  R.clouds = Array.from({ length: 7 }, (_, i) => ({ x: r() * WW * 2 - WW / 2, y: 14 + r() * 50, v: 4 + r() * 6, p: Array.from({ length: 4 }, (_, k) => [k * 18 - 27 + r() * 8, r() * 6 - 3, 16 + r() * 14]) }));
  R.weatherP = Array.from({ length: 140 }, () => ({ x: r(), y: r(), vx: 0.02 + r() * 0.02, vy: 0.5 + r() * 0.5 }));
  buildPattern();
}
initRuntime();
const saved = load();
if (saved) loadState(saved, true); else { S = newState(); genWorld(); loadState(S, false); banner(S.name, 'A fire is lit by the river'); }
resize(); window.addEventListener('resize', resize);
R.lastInput = performance.now();

let last = performance.now(), acc = 0, saveAcc = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  let dt = (nowMs - last) / 1000; last = nowMs; if (dt <= 0) return;
  if (dt > 4) { const rep = bulkSim(dt); if (rep.sim > 300) showWelcome(rep); dt = 0; }
  const now = nowMs / 1000;
  if (!R.paused && dt > 0) { const sdt = Math.min(dt, 0.1) * R.speed; const steps = Math.max(1, Math.ceil(sdt / 0.1)); for (let i = 0; i < steps; i++) simStep(sdt / steps); }
  for (let i = R.particles.length - 1; i >= 0; i--) { const p = R.particles[i]; p.life -= dt; if (p.life <= 0) { R.particles.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; if (!p.smoke) p.vy += 90 * dt; }
  for (let i = R.fx.length - 1; i >= 0; i--) { R.fx[i].life -= dt; if (R.fx[i].life <= 0) R.fx.splice(i, 1); }
  for (const c of R.clouds) { c.x += c.v * dt; if (c.x > WW * 1.5) c.x = -WW / 2; }
  // ambient & camera
  const idle = (nowMs - R.lastInput) / 1000;
  if (!R.ambient && idle > 30) { R.ambient = true; document.body.classList.add('ambient'); R.cineAt = 0; }
  if (R.follow) { const v = R.vById.get(R.follow); if (v) { const tz = fitScale() * 2.4; R.cam.x += (v.x - R.cam.x) * Math.min(1, dt * 3); R.cam.y += (v.y - 30 - R.cam.y) * Math.min(1, dt * 3); R.cam.z += (tz - R.cam.z) * Math.min(1, dt * 2); clampCam(); } else R.follow = null; }
  else if (R.ambient && S.settings.cinema) {
    if (now > R.cineAt) { R.cineAt = now + 22 + Math.random() * 14; const roll = Math.random(); const fs = fitScale(); if (roll < 0.35 || !S.villagers.length) R.camTarget = exploredBox(); else if (roll < 0.75) { const v = pickR(S.villagers.filter(x => !x.inside)) || S.villagers[0]; R.camTarget = { follow: v.id, z: fs * 2.1 }; } else { const b = pickR(S.buildings.concat(S.sites)); R.camTarget = { x: b.x, y: b.y - 20, z: fs * 1.8 }; } }
    if (R.camTarget) { const t = R.camTarget; let tx = t.x, ty = t.y; if (t.follow) { const v = R.vById.get(t.follow); if (v) { tx = v.x; ty = v.y - 20; } else R.camTarget = null; } if (R.camTarget) { R.cam.x += (tx - R.cam.x) * Math.min(1, dt * 0.6); R.cam.y += (ty - R.cam.y) * Math.min(1, dt * 0.6); R.cam.z += (t.z - R.cam.z) * Math.min(1, dt * 0.5); clampCam(); } }
  }
  render(now);
  acc += dt; if (acc > 0.25) { acc = 0; refreshHud(); if (R.sel && !R.sel.traits && R.sel.progress !== undefined && !S.sites.includes(R.sel)) { R.sel = null; renderInspector(); } if (R.sel && R.sel.traits && !S.villagers.includes(R.sel)) { R.sel = null; renderInspector(); } if (R.petition) { const p = R.petition; const el = $('pet-timer'); if (el) el.style.width = (clamp((p.expires - S.t) / (p.expires - p.t0), 0, 1) * 100) + '%'; } if (R.sel && !$('inspector').hidden && R.sel.traits && Math.random() < 0.3) renderInspector(); }
  saveAcc += dt; if (saveAcc > 8) { saveAcc = 0; save(); }
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.hearthfolk = { get state() { return S; }, get runtime() { return R; }, petition: makePetition, chronicle: () => S.chronicle.map(e => `Y${e.y} ${SEASONS[e.s]} ${e.d}: ${e.t}`).join('\n') };
})();
