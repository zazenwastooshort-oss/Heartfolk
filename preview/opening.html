<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening preview</title>
<style>
:root { --panel: rgba(30,52,27,.92); --ink: #f1e8d4; --accent: #e8a65e; --button: #d4893c; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #1c2b1a; color: var(--ink); font: 14px/1.3 system-ui, sans-serif; }
.stage { position: absolute; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; }
.dev { position: absolute; left: 12px; top: 12px; z-index: 60; background: var(--panel); border-radius: 10px; padding: 8px 10px;
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: calc(100vw - 48px); }
.dev button { background: var(--button); color: #2a1a08; border: 0; border-radius: 7px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
.dev input[type=range] { width: min(46vw, 420px); accent-color: var(--accent); }
.dev .read { font-variant-numeric: tabular-nums; min-width: 15em; }
.dev label { display: flex; gap: 4px; align-items: center; }
/* a stand-in for the game's HUD, to show it hides while the cinematic plays */
.topbar { position: absolute; right: 12px; top: 12px; background: var(--panel); border-radius: 10px; padding: 8px 12px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="topbar">Hearthfolk HUD (hidden while it plays)</div>
</div>
<div class="dev" id="dev">
  <button id="play" type="button">Restart</button>
  <button id="pause" type="button">Pause</button>
  <button id="skipDev" type="button">Skip to end</button>
  <input id="scrub" type="range" min="0" max="16" step="0.01" value="0" aria-label="Time">
  <label><input id="rm" type="checkbox"> reduced motion</label>
  <span class="read" id="read"></span>
</div>
<script type="module" src="./opening.ts"></script>
</body>
</html>
