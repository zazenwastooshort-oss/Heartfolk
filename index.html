<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthfolk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D scene fills the whole screen on every device; the HUD floats over it, clear of a phone's
   notch and home bar (env safe-area insets). Single look, the same for every viewer.
   Colours from docs/PLAN.md (Art and feel). */
:root {
  color-scheme: dark;
  --scene: #2c4a26; --panel: rgba(249, 243, 229, 0.9); --ink: #2b2116; --muted: #6b5c48;
  --accent: #a8641c; --xp: #5ca04a; --label: #ffffff; --shadow: rgba(0, 0, 0, 0.65); --chip: rgba(20, 28, 18, 0.8); --chip-text: #f1e8d4;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --edge: 16px;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--scene); color: var(--label); font: 14px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.stage { position: fixed; inset: 0; background: var(--scene); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.topbar { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: var(--edge); right: var(--edge);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.brand { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.1; text-shadow: 0 1px 3px var(--shadow); }
.hover { font: 700 14px/1.3 var(--body); text-shadow: 1px 1px 0 #000; margin-top: 3px; }
.hover b { color: #00ffff; }
.clock { font: 700 14px/1.2 var(--body); text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; padding-top: 2px; }

.hint { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 2 * var(--edge)); box-sizing: border-box; padding: 8px 12px; border-radius: 8px;
  background: var(--chip); color: var(--chip-text); font-size: 13px; text-align: center; pointer-events: none; transition: opacity .5s ease-out; }
.hint b { color: #ffffff; font-weight: 600; }
.hint.gone { opacity: 0; }
.notice { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 2 * var(--edge)); box-sizing: border-box; padding: 8px 12px; border-radius: 8px;
  background: var(--chip); color: #ffe7a3; font-size: 13px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s ease-out; }
.notice.show { opacity: 1; }
.mouse { display: none; }
@media (hover: hover) and (pointer: fine) { .mouse { display: inline; } .touch { display: none; } }
@media (hover: none) { .hover { display: none; } }

.floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -100%); font: 700 13px/1 var(--body); color: #fff4c8; text-shadow: 1px 1px 0 #000; white-space: nowrap; }
.float.big { font-size: 16px; color: #ffd34d; }

.skill { position: absolute; left: var(--edge); bottom: calc(var(--edge) + env(safe-area-inset-bottom, 0px));
  width: min(240px, calc(100% - 2 * var(--edge))); box-sizing: border-box; background: var(--panel); color: var(--ink);
  border-radius: 10px; padding: 8px 10px; display: grid; gap: 5px; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); pointer-events: none; }
.skills { display: grid; gap: 6px; }
.srow { display: grid; gap: 3px; }
.srow + .srow { padding-top: 6px; border-top: 1px solid rgba(43, 33, 22, .12); }
.skill .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.skill .name { font-weight: 600; font-size: 13px; }
.srow.active .name { color: var(--accent); }
.skill .lvl { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: rgba(43, 33, 22, .15); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--xp); transition: width .25s ease-out; }
.skill small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.bank { font-size: 12px; }

.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--chip-text); }
@media (prefers-reduced-motion: reduce) { .bar i, .hint, .notice { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="floats" id="floats"></div>
  <div class="topbar">
    <div><h1 class="brand">Hearthfolk</h1><div class="hover" id="hover">Walk here</div></div>
    <div class="clock" id="clock">07:40</div>
  </div>
  <div class="hint" id="hint">
    <span class="touch"><b>Tap the grass</b> to walk, <b>a rock</b> to mine, <b>a tree</b> to chop, <b>a building</b> to visit. Drag to turn, pinch to zoom.</span>
    <span class="mouse"><b>Click the grass</b> to walk, <b>a rock</b> to mine, <b>a tree</b> to chop, <b>a building</b> to visit. Drag or arrow keys to turn, scroll to zoom.</span>
  </div>
  <div class="notice" id="notice" role="status"></div>
  <div class="skill" aria-live="polite">
    <div class="skills" id="skills"></div>
    <div class="bank" id="bank">Nothing gathered yet</div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
